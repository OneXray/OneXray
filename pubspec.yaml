name: onexray
description: "Cross Platform Xray-core Client"
publish_to: "none"
version: 26.8.2+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  #---------- flutter.dev plugin
  cupertino_icons: ^1.0.9
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  quick_actions: ^1.1.0
  go_router: ^17.3.0
  image_picker: ^1.2.3
  process: ^5.0.5
  webview_flutter: ^4.14.1
  app_links: ^7.2.1

  #---------- dart.dev plugin
  # core
  path: ^1.9.1
  collection: ^1.19.1
  crypto: ^3.0.7
  pub_semver: ^2.2.0
  # i18n
  intl: ^0.20.2
  # native
  ffi: ^2.2.0

  #---------- google.dev plugin
  json_annotation: ^4.12.0
  tuple: ^2.0.2

  #---------- flutter community
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  share_plus: ^13.3.0

  #---------- third party plugin
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.0

  dio: ^5.11.0
  uuid: ^4.6.0
  permission_handler: ^13.0.0
  # qrcode
  file_picker: ^12.0.0-beta.7
  mobile_scanner: ^7.4.0
  image: ^4.9.1
  zxing2: ^0.2.4
  # export
  archive: ^4.0.9
  # state management
  flutter_bloc: ^9.1.1
  shadcn_ui: ^0.56.0
  lucide_icons_flutter: ^3.1.15
  # markdown
  flutter_markdown_plus: ^1.0.12
  duration: ^4.0.3

  flutter_local_notifications: ^22.2.0

  in_app_review: ^2.0.12

  isolate_manager: ^6.3.2

  # editor
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

  # desktop
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  win32: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  drift_dev: ^2.34.0
  pigeon: ^27.3.0
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.15.0
  ffigen: ^21.0.0

# re_editor only uses APIs that remain compatible with isolate_manager 6.x.
dependency_overrides:
  isolate_manager: ^6.3.2

flutter_gen:
  output: lib/gen/

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/dat/
    - assets/icon/
    - assets/md/
    - assets/app_icon/
    - assets/macos_icon/

ffigen:
  llvm-path:
    - "C:\Program Files\LLVM"
  output: "lib/core/ffi/generated_bindings.dart"
  headers:
    entry-points:
      - "c/include/libXray.h"
