name: onexray
description: "Cross Platform Xray-core Client"
publish_to: "none"
version: 26.9.1+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  #---------- flutter.dev plugin
  cupertino_icons: ^1.0.9
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  quick_actions: ^1.1.0
  go_router: ^17.5.0
  image_picker: ^1.2.3
  process: ^5.0.5
  webview_flutter: ^4.14.1
  app_links: ^7.2.1

  #---------- dart.dev plugin
  # core
  path: ^1.9.1
  collection: ^1.19.1
  crypto: ^3.0.7
  pub_semver: ^2.2.0
  # i18n
  intl: ^0.20.3
  # native
  ffi: ^2.2.0

  #---------- google.dev plugin
  json_annotation: ^4.12.0
  tuple: ^2.0.2

  #---------- flutter community
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  share_plus: ^13.3.0

  #---------- third party plugin
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.2

  dio: ^5.11.0
  uuid: ^4.6.0
  permission_handler: ^13.0.1
  # qrcode
  file_picker: ^12.0.0
  mobile_scanner: ^7.4.0
  image: ^4.9.2
  zxing2: ^0.2.4
  # export
  archive: ^4.2.0
  # state management
  flutter_bloc: ^9.1.1
  shadcn_ui: ^0.56.1
  lucide_icons_flutter: ^3.1.17
  # markdown
  flutter_markdown_plus: ^1.0.12
  duration: ^4.0.3

  flutter_local_notifications: ^22.3.0

  in_app_review: ^2.0.12

  isolate_manager: ^6.3.2

  # editor
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

  # desktop
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  win32: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.0
  json_serializable: ^6.14.1
  drift_dev: ^2.34.5
  pigeon: ^28.0.0
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.15.0
  ffigen: ^21.0.0
  msix: ^3.18.0

# re_editor only uses APIs that remain compatible with isolate_manager 6.x.
dependency_overrides:
  isolate_manager: ^6.3.2

msix_config:
  display_name: OneXray
  publisher_display_name: Yuan Dev LLC
  identity_name: YuanDevLLC.OneXray
  publisher: CN=3666BCB5-5482-46DD-9C19-D8A7290A39FD
  logo_path: assets/logo.png
  protocol_activation: onexray
  languages: en-us
  capabilities: internetClientServer, privateNetworkClientServer, networkingVpnProvider
  startup_task:
    task_id: VCoreStartup
    enabled: false
  os_min_version: 10.0.19042.0
  build_windows: false
  store: true

flutter_gen:
  output: lib/gen/

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/dat/
    - assets/geodata/regions.json
    - assets/icon/
    - assets/app_icon/
    - assets/macos_icon/

ffigen:
  name: NativeLibrary
  description: Generated native bindings for libXray and VCore.
  llvm-path:
    - "C:\Program Files\LLVM"
  output: "lib/core/ffi/generated_bindings.dart"
  compiler-opts:
    - "-D_WIN32"
  exclude-all-by-default: true
  headers:
    entry-points:
      - "c/include/libXray.h"
      - "c/include/vcore.h"
  functions:
    include:
      - "CGoInvoke"
      - "CGoFree"
      - "VCoreWindowsVpnInvoke"
      - "VCoreFree"
