#
# Publishes artifacts produced by the Build workflow.
#
# Trigger:
#   - workflow_dispatch: manually publishes a pre-release from a specific Build
#     workflow run id and tag.
#
# The Build workflow owns compilation and artifact upload. This workflow only
# downloads those artifacts and creates/updates a GitHub pre-release. Stable
# release promotion is a manual decision, and package-manager updates are handled
# by separate workflows after a release becomes stable.
#

name: Publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build workflow run id that produced the artifacts
        required: true
        type: string
      tag_name:
        description: Release tag, for example v26.6.1
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  pre_release:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build-run.json
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts

      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          tag="$RELEASE_TAG"

          case "$tag" in
            v*) ;;
            *)
              echo "Release tag must start with v: $tag" >&2
              exit 1
              ;;
          esac

          git check-ref-format "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify build metadata
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          python3 build_scripts/verify_release.py artifacts build-run.json \
            --tag "$RELEASE_TAG" --tag-sha "$tag_sha" > release-files.txt
          {
            echo 'files<<EOF'
            cat release-files.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: List release files
        run: cat release-files.txt

      - name: Delete matching existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG does not exist yet; nothing to delete."
            exit 0
          fi

          while IFS= read -r file; do
            asset="$(basename "$file")"
            echo "Deleting existing asset if present: $asset"
            gh release delete-asset "$RELEASE_TAG" "$asset" \
              --repo "${{ github.repository }}" \
              --yes >/dev/null 2>&1 || true
          done < release-files.txt

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          prerelease: true
          make_latest: false
          files: ${{ steps.verify.outputs.files }}
          fail_on_unmatched_files: true
          generate_release_notes: true
