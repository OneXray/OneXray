name: Validate

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        run: bash build_scripts/setup_flutter.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare generated asset paths
        run: |
          mkdir -p assets/dat
          touch assets/dat/{geoip.dat,geoip.json,geosite.dat,geosite.json,timestamp.txt}

      - name: Generate sources
        run: |
          flutter gen-l10n
          dart run build_runner build
          dart run ffigen

      - name: Verify generated sources
        run: git diff --exit-code

      - name: Check format
        run: |
          find lib test tool -name '*.dart' \
            ! -name '*.g.dart' \
            ! -path 'lib/gen/*' \
            ! -path 'lib/l10n/*' \
            ! -path 'lib/core/pigeon/messages.g.dart' \
            ! -path 'lib/core/ffi/generated_bindings.dart' \
            -print0 | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Verify layer dependencies
        run: dart run tool/check_layer_dependencies.dart

      - name: Analyze
        run: flutter analyze

      - name: Verify native JSON model contract
        run: dart run tool/check_native_model_contract.dart

      - name: Test
        run: flutter test

      - name: Check whitespace
        run: git diff --check
