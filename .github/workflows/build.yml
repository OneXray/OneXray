#
# Builds OneXray across all supported platforms.
#
# Trigger:
#   - workflow_dispatch: manually builds all or one operating system
#     (`macos` builds both the MAS and Developer ID variants)
#   - push to a tag matching `v*`: builds release artifacts
#
# Required repository secrets (set under Settings → Secrets and variables → Actions):
#
# Convention: secrets whose value is a file or a multi-line string are stored
# base64-encoded (suffix `_BASE64`) so GitHub's secret editor never mangles
# newlines or whitespace. Simple single-line identifiers / passwords are stored
# as plain strings.
#
#   Apple (iOS / macOS / macos_se):
#     FASTLANE_ASC_KEY_ID               App Store Connect API key id
#     FASTLANE_ASC_ISSUER_ID            ASC issuer id (UUID)
#     FASTLANE_ASC_KEY_BASE64           base64-encoded .p8 contents
#     FASTLANE_MAS_INSTALLER_CERT       full subject of the 3rd Party Mac Developer Installer cert
#     APPLE_DISTRIBUTION_P12_BASE64     base64 of the Apple Distribution .p12
#                                       (shared by iOS and Mac App Store app signing)
#     APPLE_MAC_INSTALLER_P12_BASE64    base64 of the 3rd Party Mac Developer Installer .p12
#     APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64
#                                       base64 of the Developer ID Application .p12
#     KEYCHAIN_PASSWORD                 password used by the .p12 files and temporary build keychain
#
#   Android:
#     ANDROID_KEYSTORE_BASE64           base64 of the upload keystore (.jks)
#     ANDROID_KEYSTORE_PASSWORD         store password
#     ANDROID_KEY_PASSWORD              key password
#     ANDROID_KEY_ALIAS                 key alias
#     ANDROID_PLAY_SERVICE_JSON_BASE64  base64 of fastlane service account JSON
#
# Layout:
#   build_scripts/app/builder.py#build_core expects XTLS/libXray and
#   XTLS/Xray-core to live as siblings of this repo. Every job therefore checks
#   out this repo to `OneXray/`, libXray to `libXray/`, and Xray-core to
#   `Xray-core/` at the workspace root. libXray is built with local Xray-core,
#   and Windows/Linux app packages compile OneXrayCore directly from that same
#   sibling Xray-core checkout. fastforge/fastlane/flutter all produce their
#   outputs under `<workspace>/output`.

name: Build
run-name: Build ${{ inputs.target || 'all' }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Operating system to build
        required: true
        type: choice
        default: all
        options:
          - all
          - android
          - ios
          - macos
          - windows
          - linux
  push:
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: false

env:
  NDK_VERSION: r29
  LIBXRAY_REF: main
  XRAY_CORE_REPOSITORY: XTLS/Xray-core
  XRAY_CORE_REF: v26.7.28
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  # =================================================================
  # Build metadata — records the source and dependency revisions for every
  # build. Tag builds additionally include tag.txt for release validation.
  # =================================================================
  release_metadata:
    runs-on: ubuntu-24.04
    steps:
      - name: Write build metadata
        run: |
          mkdir -p release-metadata
          echo "${GITHUB_EVENT_NAME}" > release-metadata/event.txt
          echo "${GITHUB_REF}" > release-metadata/ref.txt
          echo "${GITHUB_REF_NAME}" > release-metadata/ref-name.txt
          echo "${GITHUB_SHA}" > release-metadata/sha.txt
          echo "${LIBXRAY_REF}" > release-metadata/libxray-sha.txt
          echo "${XRAY_CORE_REF}" > release-metadata/xray-core-sha.txt
          echo "${{ inputs.target || 'all' }}" > release-metadata/target.txt
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "${GITHUB_REF_NAME}" > release-metadata/tag.txt
          fi

      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: release-metadata/*
          if-no-files-found: error

  # =================================================================
  # iOS — uploads to App Store Connect (TestFlight) via fastlane
  # =================================================================
  ios:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'ios'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OneXray
    steps:
      - uses: actions/checkout@v6
        with:
          path: OneXray

      - uses: actions/checkout@v6
        with:
          repository: XTLS/libXray
          ref: ${{ env.LIBXRAY_REF }}
          path: libXray

      - uses: actions/checkout@v6
        with:
          repository: ${{ env.XRAY_CORE_REPOSITORY }}
          ref: ${{ env.XRAY_CORE_REF }}
          path: Xray-core

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true

      - name: Setup Flutter
        run: bash build_scripts/setup_flutter.sh

      - name: Install Python build deps
        run: python -m pip install --upgrade pip pyyaml requests typer

      - name: Restore App Store Connect API key
        env:
          ASC_KEY_B64: ${{ secrets.FASTLANE_ASC_KEY_BASE64 }}
        run: echo "$ASC_KEY_B64" | base64 -d > ios/fastlane/AuthKey.p8

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain: signing_temp

      - name: Verify code signing identities
        run: security find-identity -v -p codesigning

      - name: Build & upload
        env:
          FASTLANE_ASC_KEY_ID: ${{ secrets.FASTLANE_ASC_KEY_ID }}
          FASTLANE_ASC_ISSUER_ID: ${{ secrets.FASTLANE_ASC_ISSUER_ID }}
        run: python3 build_scripts/main.py OneXray ios

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios
          path: output/OneXray-ios*.ipa
          if-no-files-found: error

  # =================================================================
  # macOS (MAS) — universal binary, uploads to App Store Connect
  # =================================================================
  macos:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OneXray
    steps:
      - uses: actions/checkout@v6
        with:
          path: OneXray

      - uses: actions/checkout@v6
        with:
          repository: XTLS/libXray
          ref: ${{ env.LIBXRAY_REF }}
          path: libXray

      - uses: actions/checkout@v6
        with:
          repository: ${{ env.XRAY_CORE_REPOSITORY }}
          ref: ${{ env.XRAY_CORE_REF }}
          path: Xray-core

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true

      - name: Setup Flutter
        run: bash build_scripts/setup_flutter.sh

      - name: Install Python build deps
        run: python -m pip install --upgrade pip pyyaml requests typer

      - name: Restore App Store Connect API key
        env:
          ASC_KEY_B64: ${{ secrets.FASTLANE_ASC_KEY_BASE64 }}
        run: echo "$ASC_KEY_B64" | base64 -d > macos/fastlane/AuthKey.p8

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain: signing_temp

      - name: Import Mac installer certificate
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.APPLE_MAC_INSTALLER_P12_BASE64 }}
          p12-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain: signing_temp
          create-keychain: false

      - name: Verify code signing identities
        run: security find-identity -v -p codesigning

      - name: Build & upload
        env:
          FASTLANE_ASC_KEY_ID: ${{ secrets.FASTLANE_ASC_KEY_ID }}
          FASTLANE_ASC_ISSUER_ID: ${{ secrets.FASTLANE_ASC_ISSUER_ID }}
          FASTLANE_MAS_INSTALLER_CERT: ${{ secrets.FASTLANE_MAS_INSTALLER_CERT }}
        run: python3 build_scripts/main.py OneXray macos

  # =================================================================
  # macOS SE (Developer ID) — universal binary, Developer ID signed
  #   + notarized + zipped
  # =================================================================
  macos_se:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OneXray
    steps:
      - uses: actions/checkout@v6
        with:
          path: OneXray

      - uses: actions/checkout@v6
        with:
          repository: XTLS/libXray
          ref: ${{ env.LIBXRAY_REF }}
          path: libXray

      - uses: actions/checkout@v6
        with:
          repository: ${{ env.XRAY_CORE_REPOSITORY }}
          ref: ${{ env.XRAY_CORE_REF }}
          path: Xray-core

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true

      - name: Setup Flutter
        run: bash build_scripts/setup_flutter.sh

      - name: Install Python build deps
        run: python -m pip install --upgrade pip pyyaml requests typer

      - name: Restore App Store Connect API key
        env:
          ASC_KEY_B64: ${{ secrets.FASTLANE_ASC_KEY_BASE64 }}
        run: echo "$ASC_KEY_B64" | base64 -d > macos_se/fastlane/AuthKey.p8

      - name: Import Developer ID Application certificate
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          p12-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          keychain: signing_temp

      - name: Verify code signing identities
        run: security find-identity -v -p codesigning

      - name: Build, notarize & staple
        env:
          FASTLANE_ASC_KEY_ID: ${{ secrets.FASTLANE_ASC_KEY_ID }}
          FASTLANE_ASC_ISSUER_ID: ${{ secrets.FASTLANE_ASC_ISSUER_ID }}
        run: python3 build_scripts/main.py OneXray macos_se

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos_se
          path: output/OneXray-macos-universal*.zip
          if-no-files-found: error

  # =================================================================
  # Android — uploads AAB to Play Store via fastlane
  # =================================================================
  android:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OneXray
    steps:
      - uses: actions/checkout@v6
        with:
          path: OneXray

      - uses: actions/checkout@v6
        with:
          repository: XTLS/libXray
          ref: ${{ env.LIBXRAY_REF }}
          path: libXray

      - uses: actions/checkout@v6
        with:
          repository: ${{ env.XRAY_CORE_REPOSITORY }}
          ref: ${{ env.XRAY_CORE_REF }}
          path: Xray-core

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true

      - name: Setup Flutter
        run: bash build_scripts/setup_flutter.sh

      - name: Setup Android NDK
        # libXray's Android builder invokes `gomobile bind`, which needs an NDK.
        # nttld/setup-ndk pins the version and exports ANDROID_NDK_HOME/ANDROID_NDK_ROOT.
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Install Python build deps
        run: python -m pip install --upgrade pip pyyaml requests typer

      - name: Restore Play Store service account
        env:
          PLAY_SA_B64: ${{ secrets.ANDROID_PLAY_SERVICE_JSON_BASE64 }}
        run: echo "$PLAY_SA_B64" | base64 -d > android/fastlane/playservice.json

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/keystore/upload.jks
          cat > android/keystore/keystore.properties <<EOF
          storeFile=../keystore/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Install fastlane
        run: sudo gem install fastlane --no-document

      - name: Build & upload
        run: python3 build_scripts/main.py OneXray android

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-universal
          path: output/OneXray-android-universal*.apk
          if-no-files-found: error

  # =================================================================
  # Windows x64 and arm64 — fastforge .zip + .exe
  #   x64 stays on Windows Server 2022; arm64 uses GitHub's native
  #   Windows 11 arm64 runner so Flutter, libXray, Xray-core, and Wintun
  #   all match the target architecture.
  # =================================================================
  windows:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            goarch: amd64
            package_suffix: windows-amd64
            runner: windows-2022
          - arch: arm64
            goarch: arm64
            package_suffix: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GOARCH: ${{ matrix.goarch }}
      ONEXRAY_WINDOWS_ARCH: ${{ matrix.arch }}
    defaults:
      run:
        shell: bash
        working-directory: OneXray
    steps:
      - uses: actions/checkout@v6
        with:
          path: OneXray

      - uses: actions/checkout@v6
        with:
          repository: XTLS/libXray
          ref: ${{ env.LIBXRAY_REF }}
          path: libXray

      - uses: actions/checkout@v6
        with:
          repository: ${{ env.XRAY_CORE_REPOSITORY }}
          ref: ${{ env.XRAY_CORE_REF }}
          path: Xray-core

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true

      - name: Setup Flutter
        run: bash build_scripts/setup_flutter.sh

      - name: Install Python build deps
        run: python -m pip install --upgrade pip pyyaml requests typer

      - name: Install fastforge
        run: |
          dart pub global activate fastforge
          echo "$LOCALAPPDATA/Pub/Cache/bin" >> "$GITHUB_PATH"

      - name: Install LLVM-MinGW for Windows ARM64
        if: matrix.arch == 'arm64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest"
          $asset = $release.assets |
            Where-Object { $_.name -match "^llvm-mingw-.+-ucrt-aarch64\.zip$" } |
            Select-Object -First 1
          if ($null -eq $asset) {
            throw "The latest LLVM-MinGW release has no ARM64 UCRT archive"
          }

          $archivePath = Join-Path $env:RUNNER_TEMP $asset.name
          $extractPath = Join-Path $env:RUNNER_TEMP "llvm-mingw"
          Write-Host "Downloading LLVM-MinGW $($release.tag_name): $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath

          $binPath = Get-ChildItem -LiteralPath $extractPath -Directory |
            ForEach-Object { Join-Path $_.FullName "bin" } |
            Where-Object { Test-Path (Join-Path $_ "gcc.exe") } |
            Select-Object -First 1
          if ($null -eq $binPath) {
            throw "LLVM-MinGW bin directory was not found in $extractPath"
          }
          $binPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Windows ARM64 CGo toolchain
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          where.exe gcc.exe
          where.exe g++.exe

          $gccTarget = (& gcc.exe -dumpmachine).Trim()
          $gxxTarget = (& g++.exe -dumpmachine).Trim()
          $expectedTarget = '^aarch64-w64-(windows-gnu|mingw32)$'
          if ($gccTarget -notmatch $expectedTarget) {
            throw "Unexpected gcc target: $gccTarget"
          }
          if ($gxxTarget -notmatch $expectedTarget) {
            throw "Unexpected g++ target: $gxxTarget"
          }

      - name: Build
        run: python build_scripts/main.py OneXray windows

      - name: Verify core CLI
        run: ./windows/app/OneXrayCore.exe -h

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            output/OneXray-${{ matrix.package_suffix }}.zip
            output/OneXray-${{ matrix.package_suffix }}.exe
          if-no-files-found: error

  # =================================================================
  # Linux — fastforge .zip + .deb, x64 and arm64
  #   Pinned to ubuntu-24.04 (x64) / ubuntu-24.04-arm (arm64): the
  #   produced binary's glibc requirement is whatever the runner ships
  #   (glibc 2.39). Upgrading the runner image would silently bump the
  #   minimum glibc users need, so don't use `ubuntu-latest` here.
  #   ubuntu-24.04-arm is GitHub-hosted; free for public repos, paid
  #   for private ones.
  # =================================================================
  linux:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OneXray
    steps:
      - uses: actions/checkout@v6
        with:
          path: OneXray

      - uses: actions/checkout@v6
        with:
          repository: XTLS/libXray
          ref: ${{ env.LIBXRAY_REF }}
          path: libXray

      - uses: actions/checkout@v6
        with:
          repository: ${{ env.XRAY_CORE_REPOSITORY }}
          ref: ${{ env.XRAY_CORE_REF }}
          path: Xray-core

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true

      - name: Setup Flutter
        run: bash build_scripts/setup_flutter.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build clang cmake pkg-config \
            libgtk-3-dev liblzma-dev libblkid-dev libsecret-1-dev \
            libayatana-appindicator3-dev \
            file lintian

      - name: Install Python build deps
        run: python -m pip install --upgrade pip pyyaml requests typer

      - name: Install fastforge
        run: |
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Build
        run: python3 build_scripts/main.py OneXray linux

      - name: Verify Debian package
        run: |
          deb_file="$(find "$GITHUB_WORKSPACE/output" -maxdepth 1 -type f -name 'OneXray-*.deb' -print -quit)"
          contents_file="$RUNNER_TEMP/onexray-deb-contents.txt"
          test -n "$deb_file"
          test "$(dpkg-deb --field "$deb_file" Package)" = "onexray"
          dpkg-deb --contents "$deb_file" > "$contents_file"
          grep -q '/opt/OneXray/bin/OneXrayCore$' "$contents_file"
          dpkg-deb --info "$deb_file"
          lintian "$deb_file" || {
            lintian_status=$?
            echo "::warning::lintian reported Debian policy issues (exit $lintian_status)"
          }

      - name: Verify core CLI
        run: ./linux/app/OneXrayCore -h

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            output/OneXray-*.zip
            output/OneXray-*.deb
          if-no-files-found: error
